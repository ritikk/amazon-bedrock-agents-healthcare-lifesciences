agent_name: "PR Sentiment Intelligence Agent"
agent_description: "AI-powered solution that monitors and analyzes patient sentiment on Drugs.com to help pharmaceutical companies understand real-world drug experiences and identify emerging issues."

test_cases:
  - name: "Basic Drug Review Collection"
    description: "Test basic functionality of collecting patient reviews for a specific drug"
    input: "Collect patient reviews for Lipitor from Drugs.com"
    expected_output_contains:
      - "reviews"
      - "Lipitor"
      - "patient"
    evaluation_criteria:
      - "Agent successfully invokes Tavily search"
      - "Returns structured review data"
      - "Includes quality metrics"

  - name: "Data Quality Assessment"
    description: "Test the agent's ability to assess and filter review quality"
    input: "Search for Metformin reviews and provide quality assessment"
    expected_output_contains:
      - "quality"
      - "score"
      - "medical"
    evaluation_criteria:
      - "Provides quality scoring for reviews"
      - "Filters out low-quality content"
      - "Identifies medical context"

  - name: "Multi-Drug Analysis"
    description: "Test batch processing of multiple drug reviews"
    input: "Compare patient reviews between Lipitor and Crestor"
    expected_output_contains:
      - "Lipitor"
      - "Crestor"
      - "comparison"
    evaluation_criteria:
      - "Processes multiple drugs"
      - "Provides comparative analysis"
      - "Maintains data structure consistency"

  - name: "Error Handling"
    description: "Test agent's error handling capabilities"
    input: "Search for reviews of a non-existent drug called 'FakeMedicine123'"
    expected_output_contains:
      - "error"
      - "not found"
    evaluation_criteria:
      - "Handles invalid drug names gracefully"
      - "Provides clear error messages"
      - "Maintains system stability"

  - name: "Medical Context Extraction"
    description: "Test extraction of medical context from reviews"
    input: "Analyze patient reviews for diabetes medications and extract medical context"
    expected_output_contains:
      - "medical"
      - "diabetes"
      - "context"
    evaluation_criteria:
      - "Identifies medical terminology"
      - "Extracts patient demographics when available"
      - "Recognizes drug-related conditions"

evaluation_metrics:
  - name: "Data Collection Accuracy"
    description: "Percentage of successful review collections"
    target: ">90%"
    
  - name: "Quality Filtering Effectiveness"
    description: "Percentage of high-quality reviews retained"
    target: ">70%"
    
  - name: "Medical Context Recognition"
    description: "Accuracy of medical term identification"
    target: ">85%"
    
  - name: "Response Time"
    description: "Average time to collect and process reviews"
    target: "<60 seconds"

success_criteria:
  - "All test cases pass evaluation criteria"
  - "Data collection accuracy >90%"
  - "Quality filtering retains >70% of relevant reviews"
  - "Medical context recognition >85% accurate"
  - "Response time <60 seconds for typical queries"

notes:
  - "Requires Tavily API key for full functionality"
  - "Lambda function must be deployed before testing"
  - "Respects Drugs.com rate limits and terms of service"
  - "Follows healthcare data privacy guidelines"
