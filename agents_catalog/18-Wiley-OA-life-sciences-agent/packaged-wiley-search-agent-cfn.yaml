AWSTemplateFormatVersion: '2010-09-09'
Description: Creates Wiley's search agent.
Parameters:
  AgentAliasName:
    Type: String
    Default: ''
  BedrockModelId:
    Type: String
    Description: The ID of the Foundation Model to use for the Agent
    Default: us.amazon.nova-pro-v1:0
  AgentIAMRoleArn:
    Type: String
    Description: The arn for the agent IAM role
Conditions:
  CreateAgentAliasCondition:
    Fn::Not:
    - Fn::Equals:
      - Ref: AgentAliasName
      - ''
Resources:
  WileySearchLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - WileySearchLambdaRole
        - Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: hcls-agent-toolkit-929445170179-us-east-1
        S3Key: f49e887c58ef30ddd4b269769553d276
  WileySearchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  WileySearchLambdaAgentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::GetAtt:
        - WileySearchLambdaFunction
        - Arn
      Principal: bedrock.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*
  WileySearchLambdaAgentAliasPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::GetAtt:
        - WileySearchLambdaFunction
        - Arn
      Principal: bedrock.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
  WileySearchAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      ActionGroups:
      - ActionGroupName: UserInputAction
        ParentActionGroupSignature: AMAZON.UserInput
        ActionGroupState: ENABLED
      - ActionGroupName: WileySearch
        Description: Actions for answering questions with information from an Open
          Access subset of Wiley Online Library related to Health Sciences
        ActionGroupExecutor:
          Lambda:
            Fn::GetAtt:
            - WileySearchLambdaFunction
            - Arn
        ActionGroupState: ENABLED
        FunctionSchema:
          Functions:
          - Name: wiley_search
            Description: Execute a search query using Wiley Search.
            Parameters:
              question:
                Description: "The search query to execute with Wiley. Example: 'How\
                  \ to handle uncertain deaths?'"
                Type: string
                Required: true
      AgentName:
        Fn::Join:
        - '-'
        - - wiley-search-agent
          - Fn::Select:
            - 4
            - Fn::Split:
              - '-'
              - Fn::Select:
                - 2
                - Fn::Split:
                  - /
                  - Ref: AWS::StackId
      AgentResourceRoleArn:
        Ref: AgentIAMRoleArn
      AutoPrepare: true
      Description: Answer questions by searching on Wiley Content.
      FoundationModel:
        Ref: BedrockModelId
      GuardrailConfiguration:
        GuardrailIdentifier:
          Fn::GetAtt:
          - WileySearchGuardrail
          - GuardrailId
        GuardrailVersion:
          Fn::GetAtt:
          - WileySearchGuardrail
          - Version
      Instruction: "You are a highly knowledgeable and friendly AI assistant designed\
        \ to assist users with accurate and detailed information. \nYou have access\
        \ to a function that based on your search query, retrieves data from scientific\
        \ articles in the Wiley knowledgebase. \nWhen responding to user queries,\
        \ follow these guidelines:\n\n1. **Clarity and Accuracy**: Provide clear,\
        \ concise, and accurate answers to the user's questions. Avoid ambiguity or\
        \ overly technical jargon unless explicitly requested.\n\n2. **Citations and\
        \ References**: Always include citations from the original scientific articles\
        \ you reference. Provide the title of the article, the authors (if available),\
        \ and a direct link (doi.org) to the source.\n\n3. **Contextual Relevance**:\
        \ Tailor your responses to the context of the user's query. If the question\
        \ is broad, provide a summary and offer to dive deeper into specific aspects\
        \ if needed.\n\n4. **Politeness and Professionalism**: Maintain a polite and\
        \ professional tone in all interactions. Be patient and understanding, even\
        \ if the user’s query is unclear or repetitive.\n\n5. **Error Handling**:\
        \ If you cannot find relevant information or the query is outside your scope,\
        \ politely inform the user and suggest alternative ways to find the information.\n\
        \n6. **Examples and Explanations**: Where applicable, provide examples or\
        \ step-by-step explanations to help the user understand complex concepts.\n\
        \n7. **Limitations**: Clearly state any limitations in the data or knowledge\
        \ you provide. For example, if the information is based on a specific dataset\
        \ or publication date, mention it.\n\nExpected Result:\nYour responses should\
        \ be informative, well-structured, and helpful, ensuring the user feels supported\
        \ and informed. Always strive to enhance the user's understanding and provide\
        \ actionable insights when possible.\n"
  AgentAliasResource:
    Type: AWS::Bedrock::AgentAlias
    Condition: CreateAgentAliasCondition
    Properties:
      AgentId:
        Fn::GetAtt:
        - WileySearchAgent
        - AgentId
      AgentAliasName:
        Ref: AgentAliasName
  WileySearchGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      BlockedInputMessaging: Sorry, your query violates our usage policies.
      BlockedOutputsMessaging: Sorry, I am unable to reply because the output violates
        our usage policies.
      ContentPolicyConfig:
        FiltersConfig:
        - InputStrength: HIGH
          OutputStrength: HIGH
          Type: SEXUAL
        - InputStrength: HIGH
          OutputStrength: HIGH
          Type: VIOLENCE
        - InputStrength: HIGH
          OutputStrength: HIGH
          Type: HATE
        - InputStrength: HIGH
          OutputStrength: HIGH
          Type: INSULTS
        - InputStrength: HIGH
          OutputStrength: HIGH
          Type: MISCONDUCT
        - InputStrength: HIGH
          OutputStrength: NONE
          Type: PROMPT_ATTACK
      Description: Turn on to block profane words and other harmful content.
      Name: WileySearchGuardrail
      WordPolicyConfig:
        ManagedWordListsConfig:
        - Type: PROFANITY
Outputs:
  AgentId:
    Description: Agent ID
    Value:
      Ref: WileySearchAgent
  AgentAliasId:
    Description: Agent Alias ID
    Value:
      Fn::GetAtt:
      - AgentAliasResource
      - AgentAliasId
    Condition: CreateAgentAliasCondition
